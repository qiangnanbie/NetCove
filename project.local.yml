name: NetCove
options:
  bundleIdPrefix: tv.netcove
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  NetCove:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Sources/NetCoveApp
    - path: Sources/NetCoveCore
    - path: Sources/NetCoveData
    - path: Sources/NetCovePlayback
    - path: Sources/NetCoveScript
    - path: Sources/NetCovePlayback/Rendering/Shaders
      buildPhase: resources
    - path: Resources
      buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.netcove.app
        PRODUCT_NAME: NetCove
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/NetCove.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: '1'
        SUPPORTS_MACCATALYST: false
        SWIFT_EMIT_LOC_STRINGS: true
    dependencies:
    - sdk: LocalAuthentication.framework
    - sdk: JavaScriptCore.framework
    - sdk: AVFoundation.framework
    - sdk: Speech.framework
    - sdk: CloudKit.framework
    scheme:
      testTargets:
      - NetCoveTests
      gatherCoverageData: true
  NetCoveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests/NetCoveTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.netcove.app.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: '5.9'
    dependencies:
    - target: NetCove
