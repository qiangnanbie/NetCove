# NetCove — XcodeGen 工程定义
# 用法：brew install xcodegen && xcodegen generate && open NetCove.xcodeproj
name: NetCove
options:
  bundleIdPrefix: tv.netcove
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # 填你的 Team ID
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  NetCove:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/NetCoveApp
      - path: Sources/NetCoveCore
      - path: Sources/NetCoveData
      - path: Sources/NetCovePlayback
      - path: Sources/NetCoveScript
      - path: Sources/NetCovePlayback/Rendering/Shaders
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.netcove.app
        PRODUCT_NAME: NetCove
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/NetCove.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - sdk: LocalAuthentication.framework
      - sdk: JavaScriptCore.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: CloudKit.framework
    scheme:
      testTargets:
        - NetCoveTests
      gatherCoverageData: true

  NetCoveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/NetCoveTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.netcove.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: NetCove

# 可选：把 FFmpeg / libplacebo / libass 编译进来后，#if canImport 的真实实现自动启用（见 NetCovePlayback）。
# 生产版建议再加入这些开源依赖（与原 App 一致的同款栈）：
#   Alamofire（网络 + 证书固定）
#   KSPlayer（系统播放器路线）
#   ffmpeg-kit / 自编 Libav*（FFmpeg 路线、DV/HDR 能力）
#   AMSMB2（SMB2）、WCDBSwift（本地库）、Nuke（图片）、DanmakuKit（弹幕）、
#   onnxruntime + sherpa-onnx（本地 AI 字幕）
