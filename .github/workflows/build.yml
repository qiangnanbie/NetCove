name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ① 编译 + 单测（模拟器，无需签名）
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Static checks
        run: |
          python3 tools/verify.py
          python3 tools/audit.py

      - name: Generate project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project NetCove.xcodeproj \
            -scheme NetCove \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | tail -n 60

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  # ② 打无签名 ipa（可自行用 AltStore / Sideloadly 签）
  unsigned-ipa:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Install xcodegen
        run: brew install xcodegen && xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project NetCove.xcodeproj \
            -scheme NetCove \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NetCove.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 40

      - name: Package ipa
        run: |
          mkdir -p build/Payload
          cp -R build/NetCove.xcarchive/Products/Applications/NetCove.app build/Payload/
          cd build && zip -qry NetCove-unsigned.ipa Payload
          ls -lh NetCove-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NetCove-unsigned-ipa
          path: build/NetCove-unsigned.ipa
