name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SCHEME: NetCove
  SIM: platform=iOS Simulator,name=iPhone 15

jobs:
  # ① 静态检查 + 无第三方依赖的编译与单测（稳定路径）
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Tooling
        run: |
          brew install xcodegen
          python3 -m pip install --quiet pyyaml

      - name: Static checks
        run: |
          python3 tools/verify.py
          python3 tools/audit.py

      - name: Generate project (no third-party)
        run: python3 scripts/gen_project.py

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project NetCove.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$SIM" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | tail -n 80

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  # ② 无签名 ipa（用 AltStore / Sideloadly / Xcode 免费证书自行签名即可安装）
  unsigned-ipa:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Generate project
        run: |
          brew install xcodegen
          python3 -m pip install --quiet pyyaml
          python3 scripts/gen_project.py

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NetCove.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NetCove.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 40

      - name: Package ipa
        run: |
          mkdir -p build/Payload
          cp -R build/NetCove.xcarchive/Products/Applications/NetCove.app build/Payload/
          cd build && zip -qry NetCove-unsigned.ipa Payload
          ls -lh NetCove-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NetCove-unsigned-ipa
          path: build/NetCove-unsigned.ipa

  # ③ 可选：带第三方依赖（FFmpeg/KSPlayer/WCDB...）的全量构建，失败不影响 ipa
  full-stack:
    needs: test
    continue-on-error: true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Generate project (with third-party)
        run: |
          brew install xcodegen
          python3 -m pip install --quiet pyyaml
          python3 scripts/gen_project.py --with-third-party --spec-out project.full.yml
          xcodebuild -resolvePackageDependencies -project NetCove.xcodeproj -scheme "$SCHEME"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project NetCove.xcodeproj \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            | tee full-build.log | tail -n 60
