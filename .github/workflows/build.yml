name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SCHEME: NetCove
  SIM: platform=iOS Simulator,name=iPhone 15

jobs:
  # ① 静态检查 + Swift 语法解析（ubuntu，免费可用）
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python deps
        run: python3 -m pip install --quiet pyyaml cryptography

      - name: Repo self-checks
        run: |
          python3 tools/verify.py
          python3 tools/audit.py

      - name: Module package check
        run: python3 tools/verify_module.py examples/dist/tv.netcove.example.hello-1.0.0.rexmod

      - name: Swift toolchain
        run: swift --version

      - name: Swift syntax parse (all sources)
        run: |
          set -o pipefail
          fail=0
          : > parse.log
          for f in $(find Sources Tests -name '*.swift' | sort); do
            if ! swiftc -parse "$f" >>parse.log 2>&1; then
              echo "PARSE FAIL: $f"
              fail=1
            fi
          done
          echo "---- parse issues ----"
          grep -E "error:" parse.log | head -50 || true
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parse-log
          path: parse.log
          if-no-files-found: ignore

  # ② 无签名 ipa（macOS runner；私有仓库需付费计划，公开仓库免费）
  unsigned-ipa:
    needs: static
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_15.2.app 2>/dev/null || true
          xcodebuild -version

      - name: Generate project (no third-party deps)
        run: |
          brew install xcodegen
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml
          .venv/bin/python scripts/gen_project.py

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NetCove.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NetCove.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee archive.log | tail -n 60

      - name: Package ipa
        run: |
          mkdir -p build/Payload
          cp -R build/NetCove.xcarchive/Products/Applications/NetCove.app build/Payload/
          cd build && zip -qry NetCove-unsigned.ipa Payload
          ls -lh NetCove-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetCove-unsigned-ipa
          path: build/NetCove-unsigned.ipa
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-log
          path: archive.log
          if-no-files-found: ignore
